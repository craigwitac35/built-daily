<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back — Built Daily</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark"></span>
        Built Daily
      </a>
      <nav class="nav-desktop">
        <a href="login.html">Log In</a>
        <a href="signup.html" class="btn btn-primary btn-sm">Create Account</a>
      </nav>
      <button class="hamburger" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
    <nav class="nav-mobile">
      <a href="login.html" class="active">Log In</a>
      <a href="signup.html">Create Account</a>
    </nav>
  </header>

  <!-- Main -->
  <main>
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1 class="page-title animate-in">Welcome Back</h1>
        <p class="page-subtitle animate-in delay-1">
          Log in to your dashboard to continue tracking your progress and staying accountable.
        </p>

        <div class="card card-elevated animate-in delay-2">
          <div id="login-alert" class="alert"></div>

          <form id="login-form">
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-input" placeholder="Your password" required>
            </div>

            <div class="form-group" style="margin-top: var(--space-lg);">
              <button type="submit" class="btn btn-primary btn-full">Log In</button>
            </div>
          </form>
        </div>

        <p class="auth-footer animate-in delay-3">
          Don't have an account yet? <a href="signup.html">Create Account</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p class="footer-name">Built Daily</p>
    <p class="footer-note">Discipline. Consistency. Progress.</p>
  </footer>

  <script src="js/nav.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module">
    import { redirectIfLoggedIn } from './js/auth.js';
    redirectIfLoggedIn();
  </script>
</body>
</html>
