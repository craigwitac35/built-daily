<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Setup – Built Daily</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html" class="logo">Built Daily</a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="log.html">Log Today</a></li>
      <li><a href="#" id="logout-btn">Logout</a></li>
    </ul>
  </nav>

  <!-- Profile Form -->
  <div class="container" style="max-width:600px; margin-top:2.5rem">
    <div class="page-header">
      <h1>Profile Setup</h1>
      <p>Tell us about yourself so we can calculate your calorie target.</p>
    </div>

    <div class="card">
      <div id="profile-alert" class="alert"></div>

      <form id="profile-form" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="10" max="120" placeholder="e.g. 28" required />
          </div>
          <div class="form-group">
            <label for="sex">Sex</label>
            <select id="sex" name="sex" required>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="height">Height (cm)</label>
          <input type="number" id="height" name="height" min="100" max="250" step="0.1" placeholder="e.g. 175" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="current-weight">Current Weight (kg)</label>
            <input type="number" id="current-weight" name="current-weight" min="30" max="350" step="0.1" placeholder="e.g. 80" required />
          </div>
          <div class="form-group">
            <label for="goal-weight">Goal Weight (kg)</label>
            <input type="number" id="goal-weight" name="goal-weight" min="30" max="350" step="0.1" placeholder="e.g. 75" required />
          </div>
        </div>

        <div class="form-group">
          <label for="activity-level">Activity Level</label>
          <select id="activity-level" name="activity-level" required>
            <option value="sedentary">Sedentary (desk job, little exercise)</option>
            <option value="light">Lightly Active (1–3 days/week)</option>
            <option value="moderate" selected>Moderately Active (3–5 days/week)</option>
            <option value="active">Very Active (6–7 days/week)</option>
            <option value="very-active">Extremely Active (hard training + physical job)</option>
          </select>
        </div>

        <hr class="divider" />

        <div id="calorie-target-display" class="alert alert-success" style="display:none"></div>

        <button type="submit" class="btn btn-success btn-full">Save Profile &amp; Calculate Target</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
