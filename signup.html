<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Built Daily</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html" class="logo">Built Daily</a>
    <ul class="nav-links">
      <li><a href="login.html">Already have an account? Log in</a></li>
    </ul>
  </nav>

  <!-- Sign-up Form -->
  <div class="container--narrow" style="margin-top:3rem">
    <div class="card">
      <h2>Create your account</h2>

      <div id="signup-alert" class="alert"></div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Jane Smith" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimum 8 characters" autocomplete="new-password" required />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-full mt-2">Create Account</button>
      </form>

      <p class="form-footer mt-2">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
